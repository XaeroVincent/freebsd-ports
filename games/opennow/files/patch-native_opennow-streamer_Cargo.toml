--- native/opennow-streamer/Cargo.toml.orig
+++ native/opennow-streamer/Cargo.toml
@@ -38,17 +38,7 @@
 oxideav-core = "0.1.34"
 oxideav-mkv = "0.0.9"
 opus = "0.3.1"
-# Pin rust-sdl2 after its bundled SDL2 update. SDL 2.26.4 from the crates.io
-# release does not compile against current PipeWire headers with modern GCC.
-#
-# This is upstream adeb978d plus a cherry-pick of upstream #1512, which Windows
-# needs because clang types C enums as `int` for MSVC and `unsigned` for Linux
-# and `set_mod_state` only accepted the Linux form. The fix cannot be taken by
-# moving the pin forward: the commit before it rewrote `Texture<'a>` to
-# `Texture<'_>` inside the `unsafe_textures` block, where `Texture` has no
-# lifetime, so every revision from there through master fails to build with the
-# feature we rely on. Drop this fork once upstream repairs `unsafe_textures`.
-sdl2 = { git = "https://github.com/zortos293/rust-sdl2.git", rev = "8c812c4a0087eaf664a11a844634200cebe9afb8", default-features = false, features = ["bundled", "raw-window-handle", "static-link", "unsafe_textures"] }
+sdl2 = { version = "0.38", default-features = false, features = ["raw-window-handle", "unsafe_textures", "use-pkgconfig"] }
 scuffle-av1 = "0.1.4"
 serde = { version = "1", features = ["derive"] }
 serde_json = "1"
