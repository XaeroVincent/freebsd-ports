--- native/opennow-streamer/crates/opennow-streamer-platform/Cargo.toml.orig
+++ native/opennow-streamer/crates/opennow-streamer-platform/Cargo.toml
@@ -25,10 +25,17 @@
 oxideav-core.workspace = true
 oxideav-mkv.workspace = true
 opus.workspace = true
-sdl2.workspace = true
 scuffle-av1.workspace = true
 serde_json.workspace = true
 
+[target.'cfg(not(target_os = "freebsd"))'.dependencies]
+# Windows, macOS and Linux keep the bundled, statically linked SDL2.
+sdl2 = { workspace = true, features = ["bundled", "static-link"] }
+
+[target.'cfg(target_os = "freebsd")'.dependencies]
+# FreeBSD links the system SDL2 (devel/sdl20) found through pkg-config.
+sdl2 = { workspace = true, features = ["use-pkgconfig"] }
+
 [target.'cfg(target_os = "windows")'.dependencies]
 raw-window-handle = "0.6"
 # sdl2-sys ships a single checked-in sdl_bindings.rs generated on Linux and
@@ -47,7 +54,7 @@
     "Win32_UI_WindowsAndMessaging",
 ] }
 
-[target.'cfg(target_os = "linux")'.dependencies]
+[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
 libc = "0.2"
 opennow-streamer-platform-linux = { path = "../opennow-streamer-platform-linux" }
 raw-window-handle = "0.6"
